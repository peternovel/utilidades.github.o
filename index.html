<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Bienvenidos</title>
    <style>
        /* Estilos generales y fondo azul solicitado */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #003366; /* Azul Cobalto/Oscuro */
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Menú Lateral Izquierdo (Sidebar) */
        #sidebar {
            width: 260px;
            background-color: rgba(0, 0, 0, 0.4); /* Fondo oscuro semitransparente */
            border-right: 2px solid #ffcc00; /* Borde dorado */
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        #sidebar h2 {
            text-align: center;
            color: #ffcc00;
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Estilo de los botones del menú */
        .menu-btn {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 12px 15px;
            margin-bottom: 15px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background-color: #ffcc00;
            color: black;
            border-color: #ffcc00;
        }

        /* Área de Contenido Principal */
        #content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Cabecera de Bienvenida */
        #welcome-header {
            text-align: center;
            margin-bottom: 20px;
        }

        #welcome-header img {
            width: 180px;
            border-radius: 5px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #welcome-header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* Estilo del Marco (Iframe) */
        #main-frame {
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background-color: white; /* Fondo blanco para el contenido de los archivos */
        }

        /* Texto de ayuda inicial */
        #placeholder-text {
            margin-top: 50px;
            text-align: center;
            font-size: 1.2rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.7);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <h2>Opciones</h2>
        
        <button class="menu-btn" onclick="cargarContenido('horario.html')">Horario</button>
        <button class="menu-btn" onclick="cargarContenido('conversion.html')">Utilidad de conversión</button>
        <button class="menu-btn" onclick="cargarContenido('frase.html')">Frase del día</button>
        
        <button class="menu-btn" onclick="irInicio()" style="margin-top: auto; border-color: #ffcc00; text-align: center;">Inicio</button>
    </nav>

    <main id="content-area">
        
        <div id="welcome-header">
            <img src="https://www.gifsanimados.org/data/media/915/bandera-de-venezuela-imagen-animada-0022.gif" alt="Bandera de Venezuela">
            <h1>Bienvenidos</h1>
        </div>

        <iframe id="main-frame" name="main-frame" src="about:blank" class="hidden"></iframe>
        
        <div id="placeholder-text">
            <p>Seleccione una opción del menú para visualizar el contenido aquí.</p>
        </div>

    </main>

    <script>
        /**
         * Función para cargar archivos locales en el iframe
         */
        function cargarContenido(archivo) {
            const frame = document.getElementById('main-frame');
            const placeholder = document.getElementById('placeholder-text');
            
            // Hacemos visible el marco y ocultamos el texto de ayuda
            frame.classList.remove('hidden');
            placeholder.classList.add('hidden');
            
            // Asignamos la ruta del archivo local al marco
            frame.src = archivo;
        }

        /**
         * Función para resetear la vista
         */
        function irInicio() {
            const frame = document.getElementById('main-frame');
            const placeholder = document.getElementById('placeholder-text');
            
            frame.src = "about:blank";
            frame.classList.add('hidden');
            placeholder.classList.remove('hidden');
        }
    </script>

</body>
</html>
